; Overrides the stock www pool (loaded after www.conf). The stock pool runs at most
; 5 PHP workers, so a sixth simultaneous request waits in line however idle the CPU is.
;
; A fixed number of workers, set per server with PHP_FPM_WORKERS: about one per
; 40 MB of memory left for PHP, and fewer than PostgreSQL's max_connections, since
; each worker keeps its own database connection open (DB_PERSISTENT).
[www]
pm = static
pm.max_children = ${PHP_FPM_WORKERS}

; Recycle a worker now and then, so a slow leak can never build up.
pm.max_requests = 1000

; A request stuck on a dead connection is cut off instead of holding a worker forever.
request_terminate_timeout = 60s
