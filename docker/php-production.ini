; Production PHP settings for the container.

; The code never changes inside a running container (a deploy builds a new image),
; so opcache need not check files for changes on every request.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Laravel resolves thousands of file paths per request; keep them cached.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
