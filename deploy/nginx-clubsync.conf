# ClubSync — Nginx vhost for on-premise deployment.
# Copy to /etc/nginx/sites-available/clubsync, edit server_name + cert paths, then:
#   sudo ln -s /etc/nginx/sites-available/clubsync /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name your-scc-domain.edu.ph;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-scc-domain.edu.ph;

    root /var/www/clubsync/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/your-scc-domain.edu.ph/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-scc-domain.edu.ph/privkey.pem;

    # Uploads: profile photos (max 2MB) and activity approval letters (max 5MB).
    client_max_body_size 10m;

    access_log /var/log/nginx/clubsync-access.log;
    error_log  /var/log/nginx/clubsync-error.log;

    # Never serve dotfiles (.env, .git, etc.) or storage/vendor directly.
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # Reverb websocket connections (Pusher-protocol path). Laravel Echo connects to
    # wss://<host>/app/<key> — proxy that through to the local Reverb process, which
    # only listens on 127.0.0.1:8080 and is never exposed directly to the internet.
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Content-hashed build assets — safe to cache aggressively; a rebuild changes the URL.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
